services:
  basketball-analyzer:
    build: .
    container_name: sports_video_analyzer
    ports:
      - "8123:8123"
    volumes:
      - ./data:/app/data
    # Hardware acceleration support (Intel VA-API / QuickSync)
    devices:
      - /dev/dri:/dev/dri
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    restart: unless-stopped
